[build]
  command = "yarn build"
  publish = ".next"
  environment = { NODE_VERSION = "18" }

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIza*"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[plugins]]
  package = "@netlify/plugin-lighthouse"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://blatam.org"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Legacy pages from current site

# Root langs routes

[[redirects]]
  from = "/en"
  to = "/"
  force = true

[[redirects]]
  from = "/es"
  to = "/"
  force = true

[[redirects]]
  from = "/zh"
  to = "/"
  force = true

